#server
server.port=${PORT}

#data source
spring.datasource.url=${DATA_SOURCE_URL}
spring.datasource.username=${DATA_SOURCE_USERNAME}
spring.datasource.password=${DATA_SOURCE_PASSWORD}
spring.datasource.driver-class-name=${DATA_SOURCE_DRIVER}
logging.level.org.springframework.jdbc=DEBUG

# Migration tools
spring.flyway.baseline-on-migrate=true

# Ensure the SQL script is executed on initialization
spring.sql.init.mode=always
spring.datasource.schema=classpath:schema.sql

# Hibernate/JPA
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql: true

#Logging
logging.level.org.springframework.jdbc.datasource.init=DEBUG
# logging.level.org.springframework=DEBUG
# logging.level.org.springframework.web.reactive=DEBUG
# logging.level.org.springframework.web.reactive.function.client=DEBUG
# logging.level.org.springframework=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

spring.resources.static-locations=classpath:/build/

#Spring security
logging.level.org.springframework.security=DEBUG

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

#Request Tracker
